name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Service Docker
        id: meta-service
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ollama-openapi-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (tags, labels) for WebClient Docker
        id: meta-webclient
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ollama-openapi-webclient
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: OllamaOpenApi.Service/Dockerfile
          push: true
          tags: ${{ steps.meta-service.outputs.tags }}
          labels: ${{ steps.meta-service.outputs.labels }}

      - name: Build and push WebClient Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: OllamaOpenApi.WebClient/Dockerfile
          push: true
          tags: ${{ steps.meta-webclient.outputs.tags }}
          labels: ${{ steps.meta-webclient.outputs.labels }}
